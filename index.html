// OLED フレンドリーな黒画面スクリーン + タップで情報＆アニメ
// Scriptable 用スクリプト

const html = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>OLED Friendly Screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <style>
    :root {
      color-scheme: dark;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      cursor: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    body::before {
      content: "";
      position: fixed;
      top: env(safe-area-inset-top);
      left: env(safe-area-inset-left);
      right: env(safe-area-inset-right);
      bottom: env(safe-area-inset-bottom);
      background: #000;
      z-index: -1;
    }

    #wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: none;
    }

    .tile {
      position: absolute;
      border: 1px solid rgba(255,255,255,0.02);
      box-sizing: border-box;
      background-color: transparent;
      mix-blend-mode: screen;
    }

    #info {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: env(safe-area-inset-left, 12px);
      padding: 8px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #f5f5f5;
      font-size: 13px;
      line-height: 1.5;
      max-width: min(90vw, 360px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #info.visible {
      opacity: 1;
    }

    #info .time {
      font-size: 18px;
      font-weight: 600;
    }

    #info .weather {
      margin-top: 4px;
      font-size: 13px;
    }

    #info .hint {
      margin-top: 6px;
      font-size: 11px;
      color: #aaa;
    }

    #tap-hint {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 8px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      color: #888;
      font-size: 12px;
      pointer-events: none;
      opacity: 1;
      transition: opacity 1.2s ease;
      text-align: center;
      white-space: nowrap;
    }

    #tap-hint.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="wrapper"></div>

  <div id="info">
    <div class="time" id="info-time">--:--</div>
    <div class="weather" id="info-weather">位置情報・天気を取得中…</div>
    <div class="hint">タップでオン／オフ切替。OLED焼き付き対策用。</div>
  </div>

  <div id="tap-hint">タップで時刻・天気＋アニメ表示</div>

  <script>
    const OPENWEATHER_API_KEY = "YOUR_OPENWEATHERMAP_API_KEY";

    let vw = window.innerWidth;
    let vh = window.innerHeight;

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }
    function randInt(min, max) {
      return Math.floor(rand(min, max + 1));
    }
    function randomHue() {
      return randInt(0, 359);
    }

    let displayOn = false;
    let tiles = [];
    let globalPhase = 0;
    let animRunning = false;
    let infoTimerId = null;
    let locationFetched = false;

    const wrapper = document.getElementById('wrapper');
    const infoBox = document.getElementById('info');
    const infoTime = document.getElementById('info-time');
    const infoWeather = document.getElementById('info-weather');
    const tapHint = document.getElementById('tap-hint');

    function updateTime() {
      const now = new Date();
      const hh = now.getHours().toString().padStart(2, '0');
      const mm = now.getMinutes().toString().padStart(2, '0');
      infoTime.textContent = hh + ":" + mm;
    }

    function fetchWeatherByLocation(lat, lon) {
      if (!OPENWEATHER_API_KEY || OPENWEATHER_API_KEY === "YOUR_OPENWEATHERMAP_API_KEY") {
        infoWeather.textContent = "天気APIキー未設定のため、天気は表示できません。";
        return;
      }

      const url =
        "https://api.openweathermap.org/data/2.5/weather" +
        "?lat=" + encodeURIComponent(lat) +
        "&lon=" + encodeURIComponent(lon) +
        "&units=metric&lang=ja&appid=" + encodeURIComponent(OPENWEATHER_API_KEY);

      fetch(url)
        .then(function(res){ return res.json(); })
        .then(function(data){
          const place = data && data.name ? data.name : "付近";
          const desc = data && data.weather && data.weather[0] && data.weather[0].description
            ? data.weather[0].description : "不明";
          const temp = data && data.main && typeof data.main.temp === "number"
            ? Math.round(data.main.temp) : null;
          const tempText = temp !== null ? (temp + "℃") : "--℃";

          infoWeather.textContent = place + " / " + desc + " / " + tempText;
        })
        .catch(function(){
          infoWeather.textContent = "天気情報の取得に失敗しました。";
        });
    }

    function initLocationAndWeather() {
      if (locationFetched) return;
      locationFetched = true;

      if (!("geolocation" in navigator)) {
        infoWeather.textContent = "この環境では位置情報が利用できません。";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(pos){
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          fetchWeatherByLocation(lat, lon);
        },
        function(err){
          infoWeather.textContent = "位置情報の取得が拒否されました。";
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 300000
        }
      );
    }

    function initTiles() {
      wrapper.innerHTML = "";
      tiles = [];

      const cols = Math.max(16, Math.floor(vw / 40));
      const rows = Math.max(10, Math.floor(vh / 40));
      const tileW = vw / cols;
      const tileH = vh / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const el = document.createElement('div');
          el.className = 'tile';
          el.style.left = (c * tileW) + 'px';
          el.style.top  = (r * tileH) + 'px';
          el.style.width  = Math.ceil(tileW + 1) + 'px';
          el.style.height = Math.ceil(tileH + 1) + 'px';

          const hue = randomHue();
          const phase = Math.random() * Math.PI * 2;
          const speed = rand(0.004, 0.012);
          tiles.push({ el: el, hue: hue, phase: phase, speed: speed });

          wrapper.appendChild(el);
        }
      }
    }

    function stepTiles() {
      if (!tiles.length) return;
      for (let i = 0; i < tiles.length; i++) {
        const t = tiles[i];
        t.phase += t.speed;
        const v = (Math.sin(t.phase) + 1) / 2;
        const l = 8 + 18 * v;
        const alpha = 0.03 + 0.12 * v;
        t.el.style.backgroundColor =
          "hsla(" + t.hue + ",80%," + l + "%," + alpha + ")";
      }
    }

    function stepGlobalDrift() {
      globalPhase += 0.00015;
      const dx = Math.sin(globalPhase) * 3;
      const dy = Math.cos(globalPhase * 1.3) * 3;
      wrapper.style.transform = "translate(" + dx + "px," + dy + "px)";
    }

    function animate() {
      if (!animRunning) return;
      stepTiles();
      stepGlobalDrift();
      requestAnimationFrame(animate);
    }

    function startAnimation() {
      if (animRunning) return;
      animRunning = true;
      requestAnimationFrame(animate);
    }

    function stopAnimation() {
      animRunning = false;
      wrapper.style.transform = "translate(0,0)";
    }

    function turnOn() {
      displayOn = true;
      wrapper.style.display = 'block';
      infoBox.classList.add('visible');
      tapHint.classList.add('hidden');

      updateTime();
      if (!infoTimerId) {
        infoTimerId = setInterval(updateTime, 30000);
      }

      initTiles();
      startAnimation();
      initLocationAndWeather();
    }

    function turnOff() {
      displayOn = false;
      wrapper.style.display = 'none';
      infoBox.classList.remove('visible');
      stopAnimation();
    }

    document.addEventListener('click', function(){
      if (!displayOn) {
        turnOn();
      } else {
        turnOff();
      }
    });

    window.addEventListener('resize', function(){
      vw = window.innerWidth;
      vh = window.innerHeight;
      if (displayOn) {
        initTiles();
      }
    });

    setTimeout(function(){
      tapHint.classList.add('hidden');
    }, 7000);
  </script>
</body>
</html>`;

const w = new WebView();
await w.loadHTML(html);
// フルスクリーン風の表示（Scriptable上ではこれが最大）
await w.present();
