// Scriptable用：OLEDセーフ3パターン
// 1: 真っ黒(#000)のみ / 2: タイルアニメ / 3: 粒子＋動く時計

const html = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>OLED Screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      cursor: none;
    }
    body {
      position: fixed;
      inset: 0;
      background: #000;
    }
    body::before {
      content: "";
      position: fixed;
      top: env(safe-area-inset-top);
      left: env(safe-area-inset-left);
      right: env(safe-area-inset-right);
      bottom: env(safe-area-inset-bottom);
      background: #000;
      z-index: -1;
    }
    #wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
    }
    .tile {
      position: absolute;
      border: 1px solid rgba(255,255,255,0.02);
      box-sizing: border-box;
      background-color: transparent;
      mix-blend-mode: screen;
    }
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
      mix-blend-mode: screen;
    }
    #clock {
      position: absolute;
      font-size: 22px;
      font-weight: 600;
      color: #f5f5f5;
      text-shadow: 0 0 8px rgba(255,255,255,0.3);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wrapper"></div>
  <script>
    let vw = window.innerWidth;
    let vh = window.innerHeight;

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
    function randomHue() { return randInt(0, 359); }

    const wrapper = document.getElementById('wrapper');

    let mode = 1;               // 1:黒 2:タイル 3:粒子＋時計
    let tiles = [];
    let particles = [];
    let clockEl = null;
    let clockState = null;
    let globalPhase = 0;
    let animRunning = false;

    function clearWrapper() {
      while (wrapper.firstChild) wrapper.removeChild(wrapper.firstChild);
      tiles = [];
      particles = [];
      clockEl = null;
      clockState = null;
      wrapper.style.transform = "translate(0,0)";
    }

    // --- モード1: 真っ黒 (#000のみ) ---
    function initMode1() {
      clearWrapper();
      wrapper.style.display = "none";
      document.body.style.background = "#000";
    }

    // --- モード2: タイルアニメ ---
    function initTiles() {
      clearWrapper();
      wrapper.style.display = "block";
      const cols = Math.max(16, Math.floor(vw / 40));
      const rows = Math.max(10, Math.floor(vh / 40));
      const tileW = vw / cols;
      const tileH = vh / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const el = document.createElement('div');
          el.className = 'tile';
          el.style.left = (c * tileW) + 'px';
          el.style.top  = (r * tileH) + 'px';
          el.style.width  = Math.ceil(tileW + 1) + 'px';
          el.style.height = Math.ceil(tileH + 1) + 'px';
          const hue = randomHue();
          const phase = Math.random() * Math.PI * 2;
          const speed = rand(0.004, 0.012);
          tiles.push({ el, hue, phase, speed });
          wrapper.appendChild(el);
        }
      }
    }

    function stepTiles() {
      if (!tiles.length) return;
      for (let i = 0; i < tiles.length; i++) {
        const t = tiles[i];
        t.phase += t.speed;
        const v = (Math.sin(t.phase) + 1) / 2;
        const l = 8 + 18 * v;          // 暗め
        const alpha = 0.03 + 0.12 * v; // 控えめ
        t.el.style.backgroundColor =
          "hsla(" + t.hue + ",80%," + l + "%," + alpha + ")";
      }
      globalPhase += 0.00015;
      const dx = Math.sin(globalPhase) * 3;
      const dy = Math.cos(globalPhase * 1.3) * 3;
      wrapper.style.transform = "translate(" + dx + "px," + dy + "px)";
    }

    function initMode2() {
      initTiles();
    }

    // --- モード3: 粒子＋動く時計 ---
    function initParticlesAndClock() {
      clearWrapper();
      wrapper.style.display = "block";

      const count = 260;
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'particle';
        const size = rand(2,4);
        el.style.width = size + "px";
        el.style.height = size + "px";
        const x = rand(0, vw);
        const y = rand(0, vh);
        const vx = rand(-0.25, 0.25);
        const vy = rand(-0.18, 0.18);
        el.style.left = x + "px";
        el.style.top  = y + "px";
        el.style.background =
          "hsla(" + randomHue() + ",100%,65%,0.55)";
        particles.push({ el, x, y, vx, vy });
        wrapper.appendChild(el);
      }

      clockEl = document.createElement('div');
      clockEl.id = 'clock';
      wrapper.appendChild(clockEl);

      const startX = vw * 0.3;
      const startY = vh * 0.3;
      const speed = Math.min(vw, vh) * 0.0025;
      const angle = Math.random() * Math.PI * 2;
      clockState = {
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        lastTimeStr: ""
      };
      updateClockText();
    }

    function stepParticles() {
      if (!particles.length) return;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -10) p.x = vw + 5;
        if (p.x > vw + 10) p.x = -5;
        if (p.y < -10) p.y = vh + 5;
        if (p.y > vh + 10) p.y = -5;
        p.el.style.left = p.x + "px";
        p.el.style.top  = p.y + "px";
        if (Math.random() < 0.01) {
          p.el.style.background =
            "hsla(" + randomHue() + ",100%,65%,0.55)";
        }
      }
    }

    function pad2(n){ return n < 10 ? "0" + n : "" + n; }

    function updateClockText(force) {
      if (!clockEl || !clockState) return;
      const now = new Date();
      const hh = pad2(now.getHours());
      const mm = pad2(now.getMinutes());
      const ss = pad2(now.getSeconds());
      const text = hh + ":" + mm + ":" + ss;
      if (force || text !== clockState.lastTimeStr) {
        clockState.lastTimeStr = text;
        clockEl.textContent = text;
      }
    }

    function stepClock() {
      if (!clockEl || !clockState) return;
      const margin = 16;
      clockState.x += clockState.vx;
      clockState.y += clockState.vy;

      if (clockState.x < margin) {
        clockState.x = margin;
        clockState.vx = Math.abs(clockState.vx);
      } else if (clockState.x > vw - margin) {
        clockState.x = vw - margin;
        clockState.vx = -Math.abs(clockState.vx);
      }
      if (clockState.y < margin) {
        clockState.y = margin;
        clockState.vy = Math.abs(clockState.vy);
      } else if (clockState.y > vh - margin) {
        clockState.y = vh - margin;
        clockState.vy = -Math.abs(clockState.vy);
      }

      if (Math.random() < 0.003) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.min(vw, vh) * 0.0025;
        clockState.vx = Math.cos(angle) * speed;
        clockState.vy = Math.sin(angle) * speed;
      }

      clockEl.style.left = clockState.x + "px";
      clockEl.style.top  = clockState.y + "px";

      updateClockText(false);
    }

    function initMode3() {
      initParticlesAndClock();
    }

    // --- モード切替 ---
    function setMode(m) {
      mode = m;
      if (mode === 1) initMode1();
      else if (mode === 2) initMode2();
      else if (mode === 3) initMode3();
    }

    document.addEventListener('click', function () {
      const next = mode >= 3 ? 1 : (mode + 1);
      setMode(next);
    });

    window.addEventListener('resize', function () {
      vw = window.innerWidth;
      vh = window.innerHeight;
      setMode(mode);
    });

    function animate() {
      if (!animRunning) return;
      if (mode === 2) {
        stepTiles();
      } else if (mode === 3) {
        stepParticles();
        stepClock();
      }
      requestAnimationFrame(animate);
    }

    function startAnimationLoop() {
      if (animRunning) return;
      animRunning = true;
      requestAnimationFrame(animate);
    }

    (function init() {
      setMode(1);
      startAnimationLoop();
    })();
  </script>
</body>
</html>`;

const w = new WebView();
await w.loadHTML(html);
await w.present();
