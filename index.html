const html = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin:0; padding:0;
      width:100%; height:100%;
      overflow:hidden;
      background:#000;
      touch-action:none;
      cursor:none;
    }
    body::before {
      content:""; position:fixed;
      top:env(safe-area-inset-top);
      left:env(safe-area-inset-left);
      right:env(safe-area-inset-right);
      bottom:env(safe-area-inset-bottom);
      background:#000; z-index:-1;
    }
    #wrapper { position:absolute; inset:0; overflow:hidden; }
    .tile{
      position:absolute;
      border:1px solid rgba(255,255,255,0.04);
      box-sizing:border-box;
      background-color:transparent;
      mix-blend-mode:screen;
    }
    .particle{
      position:absolute;
      width:3px; height:3px; border-radius:50%;
      background:rgba(255,255,255,0.5);
      mix-blend-mode:screen;
    }
  </style>
</head>
<body>
<div id="wrapper"></div>
<script>
let vw=window.innerWidth, vh=window.innerHeight;

function r(a,b){return Math.random()*(b-a)+a;}
function ri(a,b){return Math.floor(r(a,b+1));}
function rh(){return ri(0,359);}

const wrap=document.getElementById("wrapper");
let mode=1, tiles=[], particles=[];
let gp=0, running=false;

function clearAll(){
  while(wrap.firstChild) wrap.removeChild(wrap.firstChild);
  tiles=[]; particles=[];
  wrap.style.transform="translate(0,0)";
}

function mode1(){
  clearAll();
  wrap.style.display="none";
  document.body.style.background="#000";
}

function initTiles(){
  clearAll();
  wrap.style.display="block";

  const cols=Math.max(20,Math.floor(vw/32));
  const rows=Math.max(12,Math.floor(vh/32));
  const tw=vw/cols, th=vh/rows;

  for(let r0=0;r0<rows;r0++){
    for(let c0=0;c0<cols;c0++){
      const bx=c0*tw, by=r0*th;
      const el=document.createElement("div");
      el.className="tile";
      el.style.left=bx+"px";
      el.style.top=by+"px";
      el.style.width=Math.ceil(tw+1)+"px";
      el.style.height=Math.ceil(th+1)+"px";

      tiles.push({
        el:el,
        bx:bx, by:by,
        hue:rh(),
        targetHue:rh(),
        hueLerp:r(0.002,0.01),
        phase:Math.random()*Math.PI*2,
        phaseSp:r(0.03,0.08),
        mpx:Math.random()*Math.PI*2,
        mpy:Math.random()*Math.PI*2,
        msx:r(0.02,0.06),
        msy:r(0.02,0.06),
        amp:r(4,12)
      });

      wrap.appendChild(el);
    }
  }
}

function stepTiles(){
  for(const t of tiles){
    t.phase+=t.phaseSp;
    const v=(Math.sin(t.phase)+1)/2;

    if(Math.random()<0.005) t.targetHue=rh();
    const dh=(t.targetHue - t.hue + 540)%360 - 180;
    t.hue+=dh*t.hueLerp;
    if(t.hue<0)t.hue+=360;
    if(t.hue>=360)t.hue-=360;

    const l=6+28*v;
    const a=0.04+0.22*v;
    t.el.style.backgroundColor=`hsla(${t.hue},85%,${l}%,${a})`;

    t.mpx+=t.msx;
    t.mpy+=t.msy;
    const ox=Math.sin(t.mpx)*t.amp;
    const oy=Math.cos(t.mpy)*t.amp;
    t.el.style.left=(t.bx+ox)+"px";
    t.el.style.top=(t.by+oy)+"px";
  }
  gp+=0.0008;
  const dx=Math.sin(gp)*8;
  const dy=Math.cos(gp*1.3)*8;
  wrap.style.transform=`translate(${dx}px,${dy}px)`;
}

function mode2(){ initTiles(); }

function initParticles(){
  clearAll();
  wrap.style.display="block";
  const count=260;
  for(let i=0;i<count;i++){
    const el=document.createElement("div");
    el.className="particle";
    const x=r(0,vw), y=r(0,vh);
    const vx=r(-0.25,0.25), vy=r(-0.18,0.18);
    el.style.left=x+"px";
    el.style.top=y+"px";
    particles.push({el,x,y,vx,vy});
    wrap.appendChild(el);
  }
}

function stepParticles(){
  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<-10)p.x=vw+5;
    if(p.x>vw+10)p.x=-5;
    if(p.y<-10)p.y=vh+5;
    if(p.y>vh+10)p.y=-5;
    p.el.style.left=p.x+"px";
    p.el.style.top=p.y+"px";
  }
}

function mode3(){ initParticles(); }

function setMode(m){
  mode=m;
  if(m===1)mode1();
  else if(m===2)mode2();
  else if(m===3)mode3();
}

document.addEventListener("click",()=>{ setMode(mode>=3?1:mode+1); });
window.addEventListener("resize",()=>{
  vw=innerWidth; vh=innerHeight; setMode(mode);
});

function loop(){
  if(!running)return;
  if(mode===2) stepTiles();
  else if(mode===3) stepParticles();
  requestAnimationFrame(loop);
}

running=true;
setMode(1);
requestAnimationFrame(loop);
</script>
</body>
</html>`;
const w=new WebView();
await w.loadHTML(html);
await w.present();
