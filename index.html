const html = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>OLED Screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      cursor: none;
    }
    body {
      position: fixed;
      inset: 0;
      background: #000;
    }
    body::before {
      content: "";
      position: fixed;
      top: env(safe-area-inset-top);
      left: env(safe-area-inset-left);
      right: env(safe-area-inset-right);
      bottom: env(safe-area-inset-bottom);
      background: #000;
      z-index: -1;
    }
    #wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
    }
    .tile {
      position: absolute;
      border: 1px solid rgba(255,255,255,0.04);
      box-sizing: border-box;
      background-color: transparent;
      mix-blend-mode: screen;
    }
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
      mix-blend-mode: screen;
    }
    #clock {
      position: absolute;
      font-size: 22px;
      font-weight: 600;
      color: #f5f5f5;
      text-shadow: 0 0 8px rgba(255,255,255,0.3);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wrapper"></div>
  <script>
    let vw = window.innerWidth;
    let vh = window.innerHeight;

    function r(min, max) { return Math.random() * (max - min) + min; }
    function ri(min, max) { return Math.floor(r(min, max + 1)); }
    function rh() { return ri(0, 359); }
    function p2(n){ return n < 10 ? "0" + n : "" + n; }

    const wrapper = document.getElementById("wrapper");

    let mode = 1;
    let tiles = [];
    let particles = [];
    let clockEl = null;
    let clockState = null;
    let globalPhase = 0;
    let animRunning = false;

    function clearWrapper() {
      while (wrapper.firstChild) wrapper.removeChild(wrapper.firstChild);
      tiles = [];
      particles = [];
      clockEl = null;
      clockState = null;
      wrapper.style.transform = "translate(0,0)";
    }

    function initMode1() {
      clearWrapper();
      wrapper.style.display = "none";
      document.body.style.background = "#000000";
    }

    function initTiles() {
      clearWrapper();
      wrapper.style.display = "block";

      const cols = Math.max(20, Math.floor(vw / 32));
      const rows = Math.max(12, Math.floor(vh / 32));
      const tileW = vw / cols;
      const tileH = vh / rows;

      for (let rIdx = 0; rIdx < rows; rIdx++) {
        for (let cIdx = 0; cIdx < cols; cIdx++) {
          const bx = cIdx * tileW;
          const by = rIdx * tileH;

          const el = document.createElement("div");
          el.className = "tile";
          el.style.left = bx + "px";
          el.style.top  = by + "px";
          el.style.width  = Math.ceil(tileW + 1) + "px";
          el.style.height = Math.ceil(tileH + 1) + "px";

          const hue = rh();
          const targetHue = rh();
          const hueLerpSpeed = r(0.002, 0.01);
          const phase = Math.random() * Math.PI * 2;
          const phaseSpeed = r(0.03, 0.08);
          const movePhaseX = Math.random() * Math.PI * 2;
          const movePhaseY = Math.random() * Math.PI * 2;
          const moveSpeedX = r(0.02, 0.06);
          const moveSpeedY = r(0.02, 0.06);
          const amp = r(4, 12);

          tiles.push({
            el: el,
            bx: bx,
            by: by,
            hue: hue,
            targetHue: targetHue,
            hueLerpSpeed: hueLerpSpeed,
            phase: phase,
            phaseSpeed: phaseSpeed,
            movePhaseX: movePhaseX,
            movePhaseY: movePhaseY,
            moveSpeedX: moveSpeedX,
            moveSpeedY: moveSpeedY,
            amp: amp
          });

          wrapper.appendChild(el);
        }
      }
    }

    function stepTiles() {
      if (!tiles.length) return;

      for (let i = 0; i < tiles.length; i++) {
        const t = tiles[i];

        t.phase += t.phaseSpeed;
        const v = (Math.sin(t.phase) + 1) / 2;

        if (Math.random() < 0.005) {
          t.targetHue = rh();
        }
        const dh = (t.targetHue - t.hue + 540) % 360 - 180;
        t.hue += dh * t.hueLerpSpeed;
        if (t.hue < 0) t.hue += 360;
        if (t.hue >= 360) t.hue -= 360;

        const l = 6 + 28 * v;
        const alpha = 0.04 + 0.22 * v;
        t.el.style.backgroundColor =
          "hsla(" + t.hue + ",85%," + l + "%," + alpha + ")";

        t.movePhaseX += t.moveSpeedX;
        t.movePhaseY += t.moveSpeedY;
        const ox = Math.sin(t.movePhaseX) * t.amp;
        const oy = Math.cos(t.movePhaseY) * t.amp;
        t.el.style.left = (t.bx + ox) + "px";
        t.el.style.top  = (t.by + oy) + "px";
      }

      globalPhase += 0.0008;
      const dx = Math.sin(globalPhase) * 8;
      const dy = Math.cos(globalPhase * 1.3) * 8;
      wrapper.style.transform = "translate(" + dx + "px," + dy + "px)";
    }

    function initMode2() {
      initTiles();
    }

    function initParticlesAndClock() {
      clearWrapper();
      wrapper.style.display = "block";

      const count = 260;
      for (let i = 0; i < count; i++) {
        const el = document.createElement("div");
        el.className = "particle";
        const size = r(2,4);
        el.style.width = size + "px";
        el.style.height = size + "px";
        const x = r(0, vw);
        const y = r(0, vh);
        const vx = r(-0.25, 0.25);
        const vy = r(-0.18, 0.18);
        el.style.left = x + "px";
        el.style.top  = y + "px";
        el.style.background =
          "hsla(" + rh() + ",100%,65%,0.55)";
        particles.push({ el: el, x: x, y: y, vx: vx, vy: vy });
        wrapper.appendChild(el);
      }

      clockEl = document.createElement("div");
      clockEl.id = "clock";
      wrapper.appendChild(clockEl);

      const startX = vw * 0.3;
      const startY = vh * 0.3;
      const speed = Math.min(vw, vh) * 0.0025;
      const angle = Math.random() * Math.PI * 2;
      clockState = {
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        last: ""
      };
      updateClockText(true);
    }

    function stepParticles() {
      if (!particles.length) return;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -10) p.x = vw + 5;
        if (p.x > vw + 10) p.x = -5;
        if (p.y < -10) p.y = vh + 5;
        if (p.y > vh + 10) p.y = -5;
        p.el.style.left = p.x + "px";
        p.el.style.top  = p.y + "px";
        if (Math.random() < 0.01) {
          p.el.style.background =
            "hsla(" + rh() + ",100%,65%,0.55)";
        }
      }
    }

    function updateClockText(force) {
      if (!clockEl || !clockState) return;
      const now = new Date();
      const hh = p2(now.getHours());
      const mm = p2(now.getMinutes());
      const ss = p2(now.getSeconds());
      const txt = hh + ":" + mm + ":" + ss;
      if (force || txt !== clockState.last) {
        clockState.last = txt;
        clockEl.textContent = txt;
      }
    }

    function stepClock() {
      if (!clockEl || !clockState) return;
      const margin = 16;
      clockState.x += clockState.vx;
      clockState.y += clockState.vy;

      if (clockState.x < margin) {
        clockState.x = margin;
        clockState.vx = Math.abs(clockState.vx);
      } else if (clockState.x > vw - margin) {
        clockState.x = vw - margin;
        clockState.vx = -Math.abs(clockState.vx);
      }
      if (clockState.y < margin) {
        clockState.y = margin;
        clockState.vy = Math.abs(clockState.vy);
      } else if (clockState.y > vh - margin) {
        clockState.y = vh - margin;
        clockState.vy = -Math.abs(clockState.vy);
      }

      if (Math.random() < 0.003) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.min(vw, vh) * 0.0025;
        clockState.vx = Math.cos(angle) * speed;
        clockState.vy = Math.sin(angle) * speed;
      }

      clockEl.style.left = clockState.x + "px";
      clockEl.style.top  = clockState.y + "px";

      updateClockText(false);
    }

    function initMode3() {
      initParticlesAndClock();
    }

    function setMode(m) {
      mode = m;
      if (mode === 1) initMode1();
      else if (mode === 2) initMode2();
      else if (mode === 3) initMode3();
    }

    document.addEventListener("click", function () {
      const next = mode >= 3 ? 1 : (mode + 1);
      setMode(next);
    });

    window.addEventListener("resize", function () {
      vw = window.innerWidth;
      vh = window.innerHeight;
      setMode(mode);
    });

    function animate() {
      if (!animRunning) return;
      if (mode === 2) {
        stepTiles();
      } else if (mode === 3) {
        stepParticles();
        stepClock();
      }
      requestAnimationFrame(animate);
    }

    function startLoop() {
      if (animRunning) return;
      animRunning = true;
      requestAnimationFrame(animate);
    }

    (function init() {
      setMode(1);
      startLoop();
    })();
  </script>
</body>
</html>`;

const w = new WebView();
await w.loadHTML(html);
await w.present();
